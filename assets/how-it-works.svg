<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1680" viewBox="0 0 1280 840" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1280" height="840" fill="#0E1017"/>
<text x="80.0" y="72.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#DBFE01" letter-spacing="3">HOW IT WORKS</text>
<text x="78" y="126" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#F4F7FF">From scenario to <tspan fill="#DBFE01">release decision</tspan></text>
<rect x="80.0" y="182.0" width="241.0" height="200.0" rx="16" fill="#161C2D" stroke="#34405E" stroke-width="1.5"/>
<rect x="102.0" y="204" width="50" height="50" rx="14" fill="#7E8FFF"/>
<text x="127.0" y="238.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#141822">1</text>
<text x="102.0" y="290.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F4F7FF">Scenarios</text>
<text x="102.0" y="318.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="16" fill="#C9D1E2">Personas and clinical</text>
<text x="102.0" y="340.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="16" fill="#C9D1E2">sets, in a fixed,</text>
<text x="102.0" y="362.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="16" fill="#C9D1E2">versioned corpus</text>
<path d="M329.0 282.0 L348.0 282.0" stroke="#E3E8F5" stroke-width="3.5" stroke-linecap="round"/>
<path d="M365.0 282.0 L348.0 291.5 L348.0 272.5 Z" fill="#E3E8F5" stroke="#E3E8F5" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="373.0" y="182.0" width="241.0" height="200.0" rx="16" fill="#161C2D" stroke="#34405E" stroke-width="1.5"/>
<rect x="395.0" y="204" width="50" height="50" rx="14" fill="#66F0FF"/>
<text x="420.0" y="238.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#141822">2</text>
<text x="395.0" y="290.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F4F7FF">Five agents</text>
<text x="395.0" y="318.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="16" fill="#C9D1E2">A0 to A4: same model,</text>
<text x="395.0" y="340.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="16" fill="#C9D1E2">same seed, one layer</text>
<text x="395.0" y="362.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="16" fill="#C9D1E2">added at each tier</text>
<path d="M622.0 282.0 L641.0 282.0" stroke="#E3E8F5" stroke-width="3.5" stroke-linecap="round"/>
<path d="M658.0 282.0 L641.0 291.5 L641.0 272.5 Z" fill="#E3E8F5" stroke="#E3E8F5" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="666.0" y="182.0" width="241.0" height="200.0" rx="16" fill="#161C2D" stroke="#34405E" stroke-width="1.5"/>
<rect x="688.0" y="204" width="50" height="50" rx="14" fill="#93F5A3"/>
<text x="713.0" y="238.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#141822">3</text>
<text x="688.0" y="290.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F4F7FF">Transcripts</text>
<text x="688.0" y="318.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="16" fill="#C9D1E2">Full conversations,</text>
<text x="688.0" y="340.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="16" fill="#C9D1E2">with the turns each</text>
<text x="688.0" y="362.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="16" fill="#C9D1E2">judge reads declared</text>
<path d="M915.0 282.0 L934.0 282.0" stroke="#E3E8F5" stroke-width="3.5" stroke-linecap="round"/>
<path d="M951.0 282.0 L934.0 291.5 L934.0 272.5 Z" fill="#E3E8F5" stroke="#E3E8F5" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="959.0" y="182.0" width="241.0" height="200.0" rx="16" fill="#161C2D" stroke="#34405E" stroke-width="1.5"/>
<rect x="981.0" y="204" width="50" height="50" rx="14" fill="#FFD36B"/>
<text x="1006.0" y="238.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#141822">4</text>
<text x="981.0" y="290.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F4F7FF">Calibrated judge</text>
<text x="981.0" y="318.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="16" fill="#C9D1E2">10 dimensions,</text>
<text x="981.0" y="340.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="16" fill="#C9D1E2">checked against</text>
<text x="981.0" y="362.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="16" fill="#C9D1E2">clinician ratings</text>
<path d="M1079.5 390.0 L1079.5 405.0" stroke="#E3E8F5" stroke-width="3.5" stroke-linecap="round"/>
<path d="M1079.5 422.0 L1070.0 405.0 L1089.0 405.0 Z" fill="#E3E8F5" stroke="#E3E8F5" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="80.0" y="430.0" width="1120.0" height="134.0" rx="16" fill="#161C2D" stroke="#34405E" stroke-width="1.5"/>
<text x="106.0" y="472.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F4F7FF">5 · Per-tier scores and adjacent deltas</text>
<text x="106.0" y="506.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" fill="#C9D1E2">Each capability layer gets a measured contribution: evidence, not intuition.</text>
<text x="106.0" y="534.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" fill="#C9D1E2">Reported by tier and by dimension, against the noise floor and judge&#8211;clinician agreement.</text>
<path d="M640 570 L640 590" stroke="#E3E8F5" stroke-width="3.5" stroke-linecap="round"/>
<path d="M355 590 L925 590" stroke="#E3E8F5" stroke-width="3.5" stroke-linecap="round"/>
<path d="M355.0 590.0 L355.0 601.0" stroke="#FF6B74" stroke-width="3.5" stroke-linecap="round"/>
<path d="M355.0 618.0 L345.5 601.0 L364.5 601.0 Z" fill="#FF6B74" stroke="#FF6B74" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M925.0 590.0 L925.0 601.0" stroke="#93F5A3" stroke-width="3.5" stroke-linecap="round"/>
<path d="M925.0 618.0 L915.5 601.0 L934.5 601.0 Z" fill="#93F5A3" stroke="#93F5A3" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="80.0" y="626.0" width="550.0" height="130.0" rx="16" fill="#2A1418" stroke="#FF6B74" stroke-width="2"/>
<text x="106.0" y="670.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FF6B74">Hard-fail conditions</text>
<text x="106.0" y="704.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" fill="#C9D1E2">Checked before any average.</text>
<text x="106.0" y="730.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" fill="#C9D1E2">A missed escalation blocks release.</text>
<rect x="650.0" y="626.0" width="550.0" height="130.0" rx="16" fill="#12241A" stroke="#93F5A3" stroke-width="2"/>
<text x="676.0" y="670.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#93F5A3">Release gate</text>
<text x="676.0" y="704.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" fill="#C9D1E2">A named owner records the decision on</text>
<text x="676.0" y="730.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" fill="#C9D1E2">this evidence: enable, restrict or reject.</text>
</svg>
